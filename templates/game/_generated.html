<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ game.title }} — Тест на слабом ПК</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b0c10;
            color: #c5c6c7;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 40px 20px;
        }
        .container { max-width: 700px; width: 100%; background: #1f2833; border: 1px solid #66fcf1; border-radius: 12px; padding: 30px; box-shadow: 0 0 20px rgba(102, 252, 241, 0.1); box-sizing: border-box; }
        h1 { color: #66fcf1; margin-top: 0; border-bottom: 2px solid #45f3ff; padding-bottom: 10px; }
        h3 { color: #ffffff; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; background: #0b0c10; padding: 15px; border-radius: 8px; }
        .info-item span { color: #45f3ff; font-weight: bold; }
        .back-btn { display: inline-block; margin-top: 20px; color: #66fcf1; text-decoration: none; font-weight: bold; }
        .back-btn:hover { text-decoration: underline; }

        .game-screenshot-box {
            width: 100%;
            margin-top: 30px;
            margin-bottom: 40px;
            border-radius: 8px;
            border: 1px solid #45f3ff;
            box-shadow: 0 0 15px rgba(69, 243, 255, 0.2);
            box-sizing: border-box;
        }

        .game-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 7px;
        }

        .fps-box {
            background: #141d26;
            border-left: 5px solid #3b82f6;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        .fps-box, .fps-box p {
            color: #cbd5e1 !important;
        }
        .fps-title {
            font-weight: bold;
            color: #60a5fa !important;
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }

        .rating-highlight {
            color: #66fcf1;
            text-shadow: 0 0 8px rgba(102, 252, 241, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ game.title }}</h1>

        {{ game.review_html | safe }}

        <a href="/" class="back-btn"
        onclick="if(document.referrer.includes(window.location.host)){history.back();return false;}">← На главную</a>
    </div>
</body>
</html>
