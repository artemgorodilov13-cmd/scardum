<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCARDUM — Вход в админку</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b0c10;
            color: #c5c6c7;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .box {
            background: #1f2833;
            border: 1px solid #1e3a45;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 340px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }
        h1 {
            color: #66fcf1;
            font-size: 1.4rem;
            margin-top: 0;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            background: #0b0c10;
            border: 1px solid #45f3ff;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            box-sizing: border-box;
            margin-top: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #66fcf1;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }
        button:hover { background: #45f3ff; }
        .error {
            color: #ff6b6b;
            text-align: center;
            margin-top: 16px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Вход в админку SCARDUM</h1>
        <form method="POST">
            <input type="password" name="password" placeholder="Пароль" required autofocus>
            <button type="submit">Войти</button>
        </form>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
